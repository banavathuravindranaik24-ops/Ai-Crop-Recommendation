name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend install

      - name: Build Web Application
        run: |
          npm --prefix frontend run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crop-Recommendation-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "AI Crop Recommendation Android App (APK)"
          body: |
            ## 📱 AI Crop Recommendation Mobile App (Android)

            Download the attached `app-debug.apk` directly onto your Android device to install and use the app.

            ### Features:
            - 🌾 Real-time soil and climate matching for 23 crops (including Chilli)
            - 📏 Land area yield and input forecast (harvest yield, fertilizer bags, seed rates)
            - ☁️ Live city weather synchronization via OpenWeatherMap
            - 🍃 Full responsive mobile UI powered by React and Capacitor

            ### Installation Instructions:
            1. Download `app-debug.apk` to your Android device.
            2. Open the file and tap **Install** (enable "Install from Unknown Sources" if prompted).
            3. Launch **AI Crop Recommendation** from your home screen.
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
